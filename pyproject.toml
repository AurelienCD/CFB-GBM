[project]
name = "cfb-gbm_v2"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexandre-Leclercq",email = "alexandre.leclercq@unicaen.fr"}
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch (>=2.11.0,<3.0.0)",
    "nnunetv2 (>=2.7.0,<3.0.0)",
    "radiomics (>=0.1,<0.2)"
]

[tool.poetry]
packages = [{include = "cfb-gbm_v2"}]





[[tool.poetry.source]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "torch-cu128"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
